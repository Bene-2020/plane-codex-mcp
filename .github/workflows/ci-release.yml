name: CI and Release

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Tests, types, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check diff whitespace
        run: git diff --check

      - name: Run tests
        run: pnpm test

      - name: Run type checks
        run: pnpm lint

      - name: Build packages and applications
        run: |
          pnpm run build:packages
          pnpm run build:apps

      - name: Read release metadata
        id: metadata
        shell: bash
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm verify:release-tag -- "$RELEASE_TAG"

  platform-native:
    name: ${{ matrix.target }} on ${{ matrix.runner }}
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: win32-x64
            runner: windows-2025
    env:
      PACKAGE_ROOT: ${{ github.workspace }}/dist/plugins/ambient-project-layer/${{ matrix.target }}
      MARKETPLACE_ROOT: ${{ github.workspace }}/dist/release/${{ matrix.target }}
      ARCHIVE_PATH: ${{ github.workspace }}/dist/release-assets/ambient-project-layer-v${{ needs.quality.outputs.version }}-${{ matrix.target }}.zip
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and applications
        run: |
          pnpm run build:packages
          pnpm run build:apps

      - name: Package native target
        run: node scripts/package-plugin.mjs --target "${{ matrix.target }}" --output "${{ env.PACKAGE_ROOT }}"

      - name: Validate native runtime and layout
        run: node scripts/validate-plugin-runtime.mjs "${{ env.PACKAGE_ROOT }}"

      - name: Run native MCP and Hook smoke
        run: node scripts/smoke-plugin.mjs --plugin-root "${{ env.PACKAGE_ROOT }}"

      - name: Build installable marketplace directory
        run: node scripts/package-release-asset.mjs --plugin-root "${{ env.PACKAGE_ROOT }}" --output "${{ env.MARKETPLACE_ROOT }}"

      - name: Create Release archive on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          cd "$MARKETPLACE_ROOT"
          zip -qry "$ARCHIVE_PATH" .

      - name: Create Release archive on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Split-Path $env:ARCHIVE_PATH) | Out-Null
          tar.exe -a -c -f $env:ARCHIVE_PATH -C $env:MARKETPLACE_ROOT .

      - name: Upload verified platform archive
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - quality
      - platform-native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum ambient-project-layer-*.zip | sort -k2 > SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "Ambient Project Layer $GITHUB_REF_NAME"
          fi
